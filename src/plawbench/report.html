<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLawBench · Local experiment</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#121c30;--line:#26334c;--text:#ecf2ff;--muted:#a5b3ce;--mint:#6ee7bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:36px 5vw 22px;border-bottom:1px solid var(--line)}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}h2{font-size:18px}p{color:var(--muted)}.eyebrow{color:var(--mint);font-size:12px;letter-spacing:2px;text-transform:uppercase}.badge{float:right;border:1px solid var(--line);border-radius:20px;padding:5px 14px;color:var(--mint)}main{max-width:1500px;margin:auto;padding:28px 5vw}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--panel);padding:20px;border:1px solid var(--line);border-radius:12px}.card strong{font-size:30px;display:block}.label{color:var(--muted);font-size:12px}.overview{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:22px 0}.barrow{display:grid;grid-template-columns:125px 1fr 55px;gap:12px;align-items:center;font-size:13px;margin:12px 0}.track{height:7px;background:#273551;border-radius:6px;overflow:hidden}.fill{background:var(--mint);height:100%}.explorer{border:1px solid var(--line);border-radius:12px;overflow:hidden}.toolbar{display:flex;gap:12px;padding:18px;background:var(--panel);align-items:center}select,input,button{font:inherit;background:#18253f;color:var(--text);border:1px solid #3a4d70;border-radius:6px;padding:7px 10px}button{cursor:pointer}button.active{background:#22534e;border-color:var(--mint)}.columns{display:grid;grid-template-columns:230px 1fr}.list{height:560px;overflow:auto;border-right:1px solid var(--line)}.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--bg);padding:12px 16px}.item:hover,.item.active{background:#1b2d48}.item small{display:block;color:var(--muted)}article{padding:22px;min-width:0}pre{white-space:pre-wrap;word-break:break-word;font:14px/1.8 -apple-system,BlinkMacSystemFont,sans-serif;max-height:415px;overflow:auto;background:#0d1629;padding:18px;border-radius:7px}.tabs{display:flex;gap:8px}footer{padding:24px 5vw;color:var(--muted);font-size:12px}#detailsTitle{margin-top:0}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.overview{grid-template-columns:1fr}.columns{grid-template-columns:160px 1fr}.toolbar{flex-wrap:wrap}}
</style>
<header><span class="badge">Apple Silicon · Local MLX</span><div class="eyebrow">Practical legal intelligence / public release</div><h1>PLawBench</h1><p>From legal scenarios to rubric-grounded evidence. Explore the actual model outputs and grading records.</p><p id="scope" style="font-size:13px;color:#e8c998"></p></header>
<main><div class="cards" id="cards"></div><p id="quality" class="label"></p><div class="overview"><section class="card"><h2>Task performance</h2><div id="taskBars"></div></section><section class="card"><h2>Case analysis · four dimensions</h2><div id="dimensionBars"></div></section></div>
<section class="explorer"><div class="toolbar"><strong>Evidence explorer</strong><select id="task" aria-label="Task"><option value="all">All tasks</option><option value="case_analysis">Case analysis</option><option value="consultation">Consultation</option><option value="plaintiff">Plaintiff statement</option><option value="defendant">Defendant statement</option></select><input id="search" aria-label="Search" placeholder="Search case ID / domain"><span id="count" class="label"></span></div><div class="columns"><nav class="list" id="list"></nav><article><h2 id="detailsTitle"></h2><p id="recordMeta" class="label"></p><div class="tabs"><button data-tab="response">Model response</button><button data-tab="question">Question</button><button data-tab="rubric">Original rubric</button><button data-tab="grade">Judge evidence</button></div><pre id="content"></pre></article></div></section></main>
<footer id="foot"></footer>
<script>
const DATA=__REPORT_DATA__;
const summary=DATA.summary;let selected=DATA.samples[0],tab='response';
document.querySelector('#scope').textContent=summary.scope+'. These scores are not comparable to the paper leaderboard.';
const number=v=>v==null?'—':v.toFixed(2);
const flags=Object.values(summary.format_checks||{}).filter(c=>c.within_requested_range===false).length;
document.querySelector('#quality').textContent=`${summary.coverage.generated}/${summary.coverage.selected} generated · ${summary.coverage.generation_truncated} token-limit stops · ${summary.coverage.judge_failed} failed judgments · ${flags} format flags`;
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
const cards=[['Public samples',summary.coverage.selected],['Valid grades',summary.coverage.graded],['Overall · 2:5:3',number(summary.overall_2_5_3_percent)+'%'],['GPU peak memory',number(summary.runtime.peak_memory_gb)+' GB']];
for(const [label,value]of cards){let e=node('div','','card');e.append(node('span',label,'label'),node('strong',value));document.querySelector('#cards').append(e)}
function bars(target,rows){for(const[k,v]of Object.entries(rows)){let row=node('div','','barrow'),track=node('div','','track'),fill=node('div','','fill');fill.style.width=Math.max(0,Math.min(100,v.score_percent||0))+'%';track.append(fill);row.append(node('span',k),track,node('span',number(v.score_percent)));document.querySelector(target).append(row)}}
bars('#taskBars',summary.tasks);bars('#dimensionBars',summary.case_dimensions);
function detail(){if(!selected){document.querySelector('#detailsTitle').textContent='No matching records';document.querySelector('#recordMeta').textContent='';document.querySelector('#content').textContent='No matching records';return}document.querySelector('#detailsTitle').textContent=selected.id+' · '+selected.domain;const check=summary.format_checks?.[selected.id];document.querySelector('#recordMeta').textContent=(selected.prediction?'Output: '+(selected.prediction.finish_reason==='length'?'token limit reached':'complete')+' · '+selected.prediction.generation_tokens.toLocaleString()+' tokens':'Generation pending')+(check?' · Format checks: '+(check.within_requested_range?'passed':'flagged for review'):'');for(const b of document.querySelectorAll('[data-tab]'))b.classList.toggle('active',b.dataset.tab===tab);let text='';if(tab==='response')text=selected.prediction?.text||'Generation pending';if(tab==='question')text=selected.messages.at(-1).content;if(tab==='rubric')text=selected.rubrics.map(r=>r.id+' / '+r.max_points+' points\n'+r.text).join('\n\n');if(tab==='grade')text=selected.grade?JSON.stringify({status:selected.grade.status,scores:selected.grade.scores,attempts:selected.grade.attempts.length},null,2):'Judging pending';document.querySelector('#content').textContent=text}
function render(){const task=document.querySelector('#task').value,q=document.querySelector('#search').value.toLowerCase();const rows=DATA.samples.filter(s=>(task==='all'||s.task===task)&&(s.id+' '+s.domain).toLowerCase().includes(q));document.querySelector('#count').textContent=rows.length+' records';const list=document.querySelector('#list');list.replaceChildren();if(rows.length&&!rows.includes(selected))selected=rows[0];for(const s of rows){let b=node('button',s.id,'item'+(selected===s?' active':''));b.append(node('small',s.domain+' · '+(s.grade?.status==='ok'?number(100*s.grade.points/s.grade.max_points)+'%':'pending')));b.onclick=()=>{selected=s;render()};list.append(b)}if(!rows.length)selected=null;detail()}
document.querySelector('#task').onchange=render;document.querySelector('#search').oninput=render;for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>{tab=b.dataset.tab;detail()};document.querySelector('#foot').textContent=summary.scope+'. '+summary.sequence_caveat+' '+summary.aggregation+'.';render();
</script></html>
